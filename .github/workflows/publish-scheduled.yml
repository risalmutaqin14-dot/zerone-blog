name: publish-scheduled

on:
  schedule:
    - cron: '*/5 * * * *' # minimum GitHub Actions; sering telat beberapa menit
  workflow_dispatch: # tombol "Run workflow" untuk tes manual

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish post terjadwal
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ADMIN_URL/api/cron/publish"
